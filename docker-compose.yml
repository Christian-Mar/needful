services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: needful
      POSTGRES_PASSWORD: needful
      POSTGRES_DB: needful
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://needful:needful@db:5432/needful
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
